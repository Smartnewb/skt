name: Keep Supabase Active

on:
  schedule:
    # Supabase free projects can pause after 1 week of inactivity.
    # Run twice a week so the Vercel app performs a real Supabase REST read.
    - cron: '0 0 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://skt-bay.vercel.app/api/health/supabase

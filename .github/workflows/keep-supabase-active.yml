name: Keep Supabase Active

on:
  schedule:
    # Supabase free projects can pause after 1 week of inactivity.
    # Run three times a week and avoid the top of the hour, where GitHub
    # scheduled workflows are more likely to be delayed or dropped.
    - cron: '17 1 * * 1,3,5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase health endpoint
        run: |
          curl --fail-with-body --show-error --silent \
            --retry 3 --retry-delay 10 --retry-all-errors \
            https://skt-bay.vercel.app/api/health/supabase
